server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-server
          uri: lb://auth-server
          predicates:
            - Path=/oauth2/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000 # The new Auth Server URI

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/