eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**


server:
  port: 8080