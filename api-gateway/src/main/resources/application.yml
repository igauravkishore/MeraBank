eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
                - JwtAuthenticationFilter
            - id: account-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=1
                - JwtAuthenticationFilter
            - id: transaction-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/transactions/**
              filters:
                - StripPrefix=1
                - JwtAuthenticationFilter

server:
  port: 8080